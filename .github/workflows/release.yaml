name: Release

on:
  push:
    branches:
      # Stable releases land on main; preview releases land on
      # preview-<slug> branches. Both fire this workflow to create the
      # matching GitHub Release.
      - main
      - 'preview-*'
    paths:
      - '*-plugin/plugin.json'
      - 'plugin.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract version
        id: version
        run: |
          MANIFEST=$(find . -maxdepth 2 -name plugin.json -path '*/.*-plugin/*' | head -1)
          if [ -n "$MANIFEST" ]; then
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${MANIFEST}','utf8')).version)")
          elif [ -f plugin.json ]; then
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plugin.json','utf8')).version)")
          elif [ -f package.json ]; then
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          else
            echo "No plugin.json or package.json found"
            exit 1
          fi
          # Preview versions carry a -preview.<slug> semver prerelease
          # suffix; flag those so the GitHub Release is marked accordingly.
          if [[ "${VERSION}" == *-preview.* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION} (prerelease=${IS_PRERELEASE})"

      - name: Check if release already exists
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Match on tag_name explicitly (not `gh release view`) so this also
          # catches draft releases, which have a tag_name but no git tag ref
          # yet — otherwise every push before the draft is published would
          # create a duplicate draft for the same version.
          MATCH=$(gh api repos/${{ github.repository }}/releases --paginate \
            --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          if [ "$MATCH" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists (or is already drafted), skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        if: steps.check.outputs.exists == 'false'
        run: |
          # Org policy blocks Actions from creating/pushing tags directly, so
          # we create a draft release instead. GitHub doesn't create the git
          # tag ref until a human publishes the draft, which is done under
          # their own (bypass-exempt) identity rather than github-actions[bot].
          TAG="${{ steps.version.outputs.tag }}"
          ARGS="--title ${TAG} --generate-notes --draft --target ${{ github.sha }}"
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            ARGS="$ARGS --prerelease"
          fi
          gh release create "${TAG}" $ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
