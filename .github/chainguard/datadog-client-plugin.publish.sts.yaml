issuer: https://token.actions.githubusercontent.com

# The patterns below must accept every shape of public release tag that
# .github/actions/parse-release-tag accepts. The grammar is
#   v<X.Y.Z>[-preview.<slug>][+<client>][-public]
# When extending the grammar (new optional segments, new channels), update
# both patterns here and propagate the policy to each public repo via the
# next stable v*-public release — tags using the new grammar will fail at
# token-mint until the updated policy reaches the public repo's main.
#
# Subject includes the numeric org/repo IDs (ddoghq@230443989,
# datadog-client-plugin@1348581382) because the ddoghq org has GitHub's OIDC
# subject-claim ID customization enabled — pinning IDs also survives any
# future repo rename/transfer.
subject_pattern: 'repo:ddoghq@230443989/datadog-client-plugin@1348581382:ref:refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[a-z0-9-]+)?(\+[a-z0-9-]+)?-public'

claim_pattern:
  event_name: push
  job_workflow_ref: 'ddoghq/datadog-client-plugin/.github/workflows/publish-public.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[a-z0-9-]+)?(\+[a-z0-9-]+)?-public'

permissions:
  contents: write
  pull_requests: write
  workflows: write
